[workspace]
resolver = "3"
members = [
    "projects/core/*",
    "projects/compiler/*",
    "projects/editor/*",
    "projects/runtime/*",
    "projects/toolchain/*",
    "projects/engines/*",
    "examples/basic",
    "examples/editor-ui-example",
    "examples/web-render-verify",
]
exclude = ["projects/compiler/gg-compiler-aot", "projects/toolchain/gg-vscode", "projects/engines/galgame"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["GG Teams"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
bincode = "3.0.0"

# 系统和硬件
num_cpus = "1.17.0"

# 图形和渲染
wgpu = { version = "29.0.1", default-features = false, features = ["naga-ir", "dx12", "vulkan"] }
winit = "0.30.13"
image = "0.25.10"
ab_glyph = "0.2.32"
bytemuck = "1.25.0"
pollster = "0.4.0"
tiny-skia = "0.12.0"
naga = { version = "29.0.1", features = ["spv-in", "spv-out"] }
piet-common = "0.8.0"
kurbo = "0.13.0"
ttf-parser = "0.25.1"

# 音频
cpal = "0.17.3"
rodio = "0.22.2"

# 命令行和工具
clap = { version = "4.6.0", features = ["derive"] }
calamine = "0.34.0"
csv = "1.4.0"

# 编译器和虚拟机
cranelift = "0.130.1"
cranelift-module = "0.130.1"
cranelift-object = "0.130.1"
cranelift-codegen = "0.130.1"
target-lexicon = "0.13.5"
rustc-hash = { version = "2.1", default-features = false }

# 异步和并发
tokio = { version = "1.51.1", features = ["full"] }
tokio-tungstenite = "0.29.0"
futures = "0.3.32"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.6"

# 工具库和实用工具
notify = "8.2.0"
dashmap = "6.1.0"
syn = "2.0.117"
quote = "1.0.45"
proc-macro2 = "1.0.106"
uuid = { version = "1.23.0", features = ["serde", "v4", "v7"] }
zip = "8.5.1"
chrono = "0.4.44"
tempfile = "3.27.0"
softbuffer = "0.4.8"
indexmap = "2.14.0"

# 输入
gilrs = "0.11.1"

# WebAssembly 依赖
wasm-bindgen = "0.2.118"
js-sys = "0.3.95"
wasm-bindgen-futures = "0.4.68"
web-sys = "0.3.95"

# 其他依赖
once_cell = "1.21.4"
regex = "1.12.3"
rusqlite = { version = "0.39", features = ["bundled"] }
sha1 = "0.11.0"

# gnostic gamer modules
gg-core = { path = "projects/core/gg-core" }
gg-error = { path = "projects/core/gg-error" }
gg-ecs = { path = "projects/core/gg-ecs" }
gg-asset = { path = "projects/core/gg-asset" }
gg-macros = { path = "projects/core/gg-macros" }
gg-meta = { path = "projects/core/gg-meta" }
gg-schedule = { path = "projects/core/gg-schedule" }
gg-reflection = { path = "projects/core/gg-reflection" }
gg-world = { path = "projects/core/gg-world" }
gg-sheet = { path = "projects/compiler/gg-sheet" }
gg-script = { path = "projects/compiler/gg-compiler-script/gg-script" }
gg-bytecode = { path = "projects/compiler/gg-bytecode" }
gg-ir = { path = "projects/compiler/gg-ir" }
gg-vm = { path = "projects/runtime/gg-vm" }
gg-ui = { path = "projects/core/gg-ui" }

# gnostic gamer toolchain
gg-manifest = { path = "projects/toolchain/gg-manifest" }
gg-factory = { path = "projects/toolchain/gg-factory" }
gg-tools = { path = "projects/toolchain/gg-tools" }
gg-mcp = { path = "projects/toolchain/gg-mcp" }
gg-lsp = { path = "projects/toolchain/gg-lsp" }

# gnostic gamer compilers
gg-compiler-shader = { path = "projects/compiler/gg-compiler-shader" }
gg-compiler = { path = "projects/compiler/gg-compiler" }
gg-compiler-aot = { path = "projects/compiler/gg-compiler-aot" }
gg-compiler-asset = { path = "projects/compiler/gg-compiler-asset" }
gg-compiler-core = { path = "projects/compiler/gg-compiler" }
gg-schema = { path = "projects/compiler/gg-schema" }
gg-compiler-widget = { path = "projects/compiler/gg-compiler-widget" }
gg-platform = { path = "projects/compiler/gg-platform" }
gg-platform-desktop = { path = "projects/compiler/gg-platform-desktop" }
gg-platform-ios = { path = "projects/compiler/gg-platform-ios" }
gg-platform-android = { path = "projects/compiler/gg-platform-android" }
gg-platform-web = { path = "projects/compiler/gg-platform-web" }

# gnostic gamer runtimes
gg-runtime = { path = "projects/runtime/gg-runtime" }
gg-runtime-ui = { path = "projects/runtime/gg-runtime-ui" }
gg-runtime-audio = { path = "projects/runtime/gg-runtime-audio" }
gg-runtime-database = { path = "projects/runtime/gg-runtime-database" }
gg-runtime-cache = { path = "projects/runtime/gg-runtime-cache" }
gg-runtime-orm = { path = "projects/runtime/gg-runtime-orm" }
gg-runtime-net = { path = "projects/runtime/gg-runtime-net" }

# gnostic gamer renderers
gg-render = { path = "projects/runtime/gg-render" }
gg-render-wgpu = { path = "projects/runtime/gg-render-wgpu" }
gg-render-native = { path = "projects/runtime/gg-render-native" }

# gnostic gamer editors
gg-editor-scene = { path = "projects/editor/gg-editor-scene" }
gg-editor-render = { path = "projects/editor/gg-editor-render" }
gg-editor-shell = { path = "projects/editor/gg-editor-shell" }
gg-editor-asset-browser = { path = "projects/editor/gg-editor-asset-browser" }
gg-editor-character = { path = "projects/editor/gg-editor-character" }
gg-editor-inspector = { path = "projects/editor/gg-editor-inspector" }
gg-editor-preview = { path = "projects/editor/gg-editor-preview" }
gg-editor-script = { path = "projects/editor/gg-editor-script" }
gg-editor-lsp = { path = "projects/editor/gg-editor-lsp" }
gg-editor-sheet = { path = "projects/editor/gg-editor-sheet" }


# gnostic gamer plugins
gg-plugin-dialogue = { path = "projects/engines/gg-plugin-dialogue" }
gg-plugin-portrait = { path = "projects/engines/gg-plugin-portrait" }
gg-plugin-scene-transition = { path = "projects/engines/gg-plugin-scene-transition" }
gg-plugin-save = { path = "projects/engines/gg-plugin-save" }
gg-plugin-tilemap = { path = "projects/engines/gg-plugin-tilemap" }
gg-plugin-spine = { path = "projects/engines/gg-plugin-spine" }

# gnostic gamer engines
gg-engine-stg = { path = "projects/engines/gg-engine-stg" }
gg-engine-platformer = { path = "projects/engines/gg-engine-platformer" }
gg-engine-galgame = { path = "projects/engines/gg-engine-galgame" }
gg-engine = { path = "projects/engines/gg-engine" }

# oak parsers
oak-core = { path = "../oaks/projects/oak-core" }
oak-von = { path = "../oaks/examples/oak-von" }
oak-voc = { path = "../oaks/examples/oak-voc" }
oak-valkyrie = { path = "../oaks/examples/oak-valkyrie" }
oak-markdown = { path = "../oaks/examples/oak-markdown" }
oak-xml = { path = "../oaks/examples/oak-xml" }
# 序列化和配置
ron = "0.12.1"
serde_json = "1.0.149"
toml = "1.1.2"
quick-xml = "0.39.2"

oak-vfs = { path = "../oaks/projects/oak-vfs" }
oak-highlight = { path = "../oaks/projects/oak-highlight" }
oak-pretty-print = { path = "../oaks/projects/oak-pretty-print" }
oak-hover = { path = "../oaks/projects/oak-hover" }
oak-lsp = { path = "../oaks/projects/oak-lsp" }
oak-mcp = { path = "../oaks/projects/oak-mcp" }
