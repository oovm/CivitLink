[workspace]
resolver = "3"
members = [
    "projects/core/*",
    "projects/compiler/gg-script",
    "projects/compiler/gg-compiler-script",
    "projects/compiler/gg-compiler-core",
    "projects/compiler/gg-compiler-aot",
    "projects/compiler/gg-shader",
    "projects/compiler/gg-sheet",
    "projects/editor/*",
    "projects/plugins/*",
    "projects/runtime/*",
    "projects/platforms/*",
    "projects/toolchain/*",
    "projects/engines/*",
    "examples/basic",
    "examples/stg-basic",
    "examples/platformer-basic",
]
# exclude = ["projects/engines/platformer", "projects/engines/stg"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["GG Teams"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
toml = "1.1.0"
wgpu = { version = "29.0.1", default-features = false, features = ["naga-ir"] }
winit = "0.30.0"
image = "0.25.0"
ab_glyph = "0.2.0"
bytemuck = "1.25.0"
pollster = "0.4.0"
cpal = "0.17.0"
rodio = "0.22.0"
clap = { version = "4.6.0", features = ["derive"] }
calamine = "0.34.0"
csv = "1.4.0"
cranelift = "0.130.0"
cranelift-module = "0.130.0"
cranelift-object = "0.130.0"
cranelift-codegen = "0.130.0"
target-lexicon = "0.13.0"
notify = "8.2.0"
dashmap = "6.1.0"
tokio = { version = "1.0.0", features = ["full"] }
syn = "2.0.0"
quote = "1.0.0"
proc-macro2 = "1.0.0"
uuid = { version = "1.23.0", features = ["serde", "v7"] }
zip = "8.0.0"
chrono = "0.4.0"
tempfile = "3.27.0"
futures = "0.3.0"
softbuffer = "0.4.0"
tiny-skia = "0.12.0"
naga = "29.0.1"
piet-common = "0.7"
kurbo = "0.11"

# gnostic gamer modules
gg-core = { path = "projects/core/gg-core" }
gg-error = { path = "projects/core/gg-error" }
gg-ecs = { path = "projects/core/gg-ecs" }
gg-asset = { path = "projects/core/gg-asset" }
gg-macros = { path = "projects/core/gg-macros" }
gg-meta = { path = "projects/core/gg-meta" }
gg-schedule = { path = "projects/core/gg-schedule" }
gg-reflection = { path = "projects/core/gg-reflection" }
gg-world = { path = "projects/core/gg-world" }
gg-sheet = { path = "projects/compiler/gg-sheet" }
gg-script = { path = "projects/compiler/gg-script" }
gg-bytecode = { path = "projects/runtime/gg-bytecode" }
gg-ir = { path = "projects/runtime/gg-ir" }
gg-vm = { path = "projects/runtime/gg-vm" }
gg-ui = { path = "projects/plugins/gg-ui" }

# gnostic gamer toolchain
gg-manifest = { path = "projects/toolchain/gg-manifest" }
gg-factory = { path = "projects/toolchain/gg-factory" }
gg-tools = { path = "projects/toolchain/gg-tools" }
gg-mcp = { path = "projects/toolchain/gg-mcp" }
gg-lsp = { path = "projects/toolchain/gg-lsp" }

# gnostic gamer compilers
gg-compiler-core = { path = "projects/compiler/gg-compiler-core" }
gg-compiler-aot = { path = "projects/compiler/gg-compiler-aot" }

# gnostic gamer runtimes
gg-runtime-core = { path = "projects/runtime/gg-runtime-core" }
gg-runtime-gui = { path = "projects/runtime/gg-runtime-gui" }
gg-runtime-audio = { path = "projects/runtime/gg-runtime-audio" }

# gnostic gamer renderers
gg-render = { path = "projects/core/gg-render" }
gg-render-wgpu = { path = "projects/runtime/gg-render-wgpu" }
gg-render-native = { path = "projects/runtime/gg-render-native" }

# gnostic gamer editors
gg-editor-scene = { path = "projects/editor/gg-editor-scene" }
gg-editor-shell = { path = "projects/editor/gg-editor-shell" }
gg-editor-asset-browser = { path = "projects/editor/gg-editor-asset-browser" }
gg-editor-character = { path = "projects/editor/gg-editor-character" }
gg-editor-inspector = { path = "projects/editor/gg-editor-inspector" }
gg-editor-preview = { path = "projects/editor/gg-editor-preview" }
gg-editor-scene-galgame = { path = "projects/editor/gg-editor-scene-galgame" }
gg-editor-script = { path = "projects/editor/gg-editor-script" }
gg-editor-lsp = { path = "projects/editor/gg-editor-lsp" }

# gnostic gamer platforms
gg-platform-mobile = { path = "projects/platforms/gg-platform-mobile" }
gg-platform-desktop = { path = "projects/platforms/gg-platform-desktop" }
gg-platform-web = { path = "projects/platforms/gg-platform-web" }

# gnostic gamer plugins
gg-plugin-dialogue = { path = "projects/plugins/gg-plugin-dialogue" }
gg-plugin-portrait = { path = "projects/plugins/gg-plugin-portrait" }
gg-plugin-scene-transition = { path = "projects/plugins/gg-plugin-scene-transition" }
