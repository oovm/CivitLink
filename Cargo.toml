[workspace]
members = [
    "projects/core/*",
    "projects/compiler/*",
    "projects/editor/*",
    "projects/plugins/*",
    "projects/runtime/*",
    "projects/platforms/*",
    "projects/toolchain/*",
    "projects/engines/*",
    "examples/basic",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["GG Teams"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wgpu = "0.20"
winit = "0.29"
image = "0.25"
ab_glyph = "0.2"
bytemuck = "1.14"
pollster = "0.3"
cpal = "0.15"
rodio = "0.17"

gg-core = { path = "projects/core/gg-core" }
gg-error = { path = "projects/core/gg-error" }
gg-ecs = { path = "projects/core/gg-ecs" }
gg-asset = { path = "projects/core/gg-asset" }
gg-reflection = { path = "projects/core/gg-reflection" }
gg-schedule = { path = "projects/core/gg-schedule" }
gg-world = { path = "projects/core/gg-world" }
gg-render = { path = "projects/core/gg-render" }
gg-render-wgpu = { path = "projects/runtime/gg-render-wgpu" }
gg-runtime-core = { path = "projects/runtime/gg-runtime-core" }
gg-runtime-audio = { path = "projects/runtime/gg-runtime-audio" }
gg-ir = { path = "projects/runtime/gg-ir" }
gg-bytecode = { path = "projects/runtime/gg-bytecode" }
gg-vm = { path = "projects/runtime/gg-vm" }
gg-script = { path = "projects/compiler/gg-script" }
gg-compiler-core = { path = "projects/compiler/gg-compiler-core" }
gg-compiler-aot = { path = "projects/compiler/gg-compiler-aot" }
gg-sheet = { path = "projects/compiler/gg-sheet" }
oak-valkyrie = { path = "../oaks/examples/oak-valkyrie" }
oak-core = { path = "../oaks/projects/oak-core" }
gg-galgame-schema = { path = "projects/engines/gg-galgame-schema" }
gg-galgame-editor-scene = { path = "projects/engines/gg-galgame-editor-scene" }
gg-ui = { path = "projects/plugins/gg-ui" }
