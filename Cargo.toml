# oak parsers
oak-core = { path = "../oaks/projects/oak-core" }
oak-von = { path = "../oaks/examples/oak-von" }
oak-valkyrie = { path = "../oaks/examples/oak-valkyrie" }
oak-highlight = { path = "../oaks/projects/oak-highlight" }
oak-pretty-print = { path = "../oaks/projects/oak-pretty-print" }
oak-lsp = { path = "../oaks/projects/oak-lsp" }
oak-hover = { path = "../oaks/projects/oak-hover" }
oak-vfs = { path = "../oaks/projects/oak-vfs" }
oak-mcp = { path = "../oaks/projects/oak-mcp" }
