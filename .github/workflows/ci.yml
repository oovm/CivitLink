name: CI

on:
    push:
        branches: [master, dev]
        tags:
            - "v*"
    pull_request:
        branches: [master, dev]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    rust-check:
        name: Rust Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rustfmt, clippy

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Check compilation
              run: cargo check --all-targets --all-features

    rust-test:
        name: Rust Test
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                feature: [no-default, default, all]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Run tests (no-default features)
              if: matrix.feature == 'no-default'
              run: cargo test --workspace --no-default-features

            - name: Run tests (default features)
              if: matrix.feature == 'default'
              run: cargo test --workspace

            - name: Run tests (all features)
              if: matrix.feature == 'all'
              run: cargo test --workspace --all-features

    js-check:
        name: JavaScript/TypeScript Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 9

            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
              id: pnpm-cache

            - name: Setup pnpm cache
              uses: actions/cache@v5
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Biome CI (format + lint)
              run: npx biome ci .

            - name: Run TypeScript type check
              run: pnpm run typecheck:frontend

            - name: Build frontend packages
              run: pnpm run build:frontend

    build-desktop:
        name: Build Desktop
        needs: rust-test
        if: startsWith(github.ref, 'refs/tags/v')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact-name: windows
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      artifact-name: macos-x64
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      artifact-name: macos-arm64
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact-name: linux
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: ${{ matrix.target }}

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-build-${{ matrix.target }}-

            - name: Build for ${{ matrix.target }}
              run: cargo build --package gg-galgame --target ${{ matrix.target }} --release

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: gwg-engine-${{ matrix.artifact-name }}
                  path: target/${{ matrix.target }}/release/

    build-wasm:
        name: Build WebAssembly
        needs: rust-test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-bindgen-cli
              run: cargo install wasm-bindgen-cli

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: wasm-cargo-build-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      wasm-cargo-build-

            - name: Build WASM
              run: cargo build --package gg-galgame --target wasm32-unknown-unknown --release

            - name: Generate bindings
              run: wasm-bindgen target/wasm32-unknown-unknown/release/gg_galgame.wasm --out-dir ./web-h5 --target web

            - name: Upload H5 artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: gwg-engine-h5
                  path: ./web-h5/
